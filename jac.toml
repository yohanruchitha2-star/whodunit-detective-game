[project]
name = "Zenith-jac"
version = "0.1.0"
description = "Whodunit detective game architecture"
entry-point = "main.jac"
kind = "web-app"

[byllm.model]
default_model = "groq/openai/gpt-oss-120b"

[byllm.call_params]
max_output_retries = 3

[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "amber"
font = "inter"
radius = "default"
menuAccent = "subtle"
menuColor = "default"

[serve]
base_route_app = "app"

[dependencies.npm]
shadcn = "^3.8.5"
react = "^18.2.0"
react-dom = "^18.2.0"
tw-animate-css = "^1.4.0"
"@fontsource-variable/inter" = "^5.3.0"

[dependencies.npm.dev]
tailwindcss = "latest"
"@tailwindcss/vite" = "latest"
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"

[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[jacpack]
name = "prj_e8bfa3650ccb4f16b941a1b7e6b6b8c9"
description = "Jac IDE snapshot for prj_e8bfa3650ccb4f16b941a1b7e6b6b8c9"
